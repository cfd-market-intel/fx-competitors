    --bg: #0d0f14;

    --border: #1e2330;
    --text: #e2e8f0;

    --accent: #38bdf8;

    --yellow: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    min-height: 100vh;

    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 24px;
  }
  .header-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  .header-meta {
    font-size: 11px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-left: auto; text-align: right; line-height: 1.8;
  }

  .tabs {
    display: flex;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab {
    padding: 14px 24px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { display: none; padding: 28px 32px; }
  .content.active { display: block; }

  /* TABLE */
  .table-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .section-label {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tier-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 4px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
    font-family: 'IBM Plex Mono', monospace;

  .tier-badge.t2 { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.3); color: #a78bfa; }
  .tier-badge.t3 { background: rgba(107,114,128,0.15); border-color: rgba(107,114,128,0.3); color: #9ca3af; }
  .tier-badge.all { background: transparent; border-color: var(--border); color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #0a0c10; }
  th {
    padding: 10px 12px; text-align: center;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    font-weight: 600; color: var(--muted);
    letter-spacing: 0.08em; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th.left { text-align: left; }
  td {
    padding: 8px 12px; text-align: center;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid #111420; transition: background 0.1s;

  td.name-cell {
    text-align: left; font-family: 'Noto Sans KR', sans-serif;
    font-weight: 600; font-size: 12px; white-space: nowrap;
  }
  td.tier-cell { font-size: 10px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr.tier-t1 td.tier-cell { color: #38bdf8; }
  tr.tier-t2 td.tier-cell { color: #a78bfa; }
  tr.tier-t3 td.tier-cell { color: #6b7280; }
  .heat { border-radius: 3px; padding: 4px 8px; display: inline-block; min-width: 44px; }
  .null-cell { color: #2a3040; }

  /* CHART TAB */
  .chart-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .broker-toggle {
    padding: 4px 11px; border-radius: 4px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif; opacity: 0.35;

  .broker-toggle.active { opacity: 1; }

  .chart-container {
    position: relative; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; height: 480px;
  }

    position: fixed;
    background: #0b0d12;
    border: 1px solid #252b3b;
    border-radius: 10px;
    padding: 0;
    width: 300px;
    pointer-events: auto;
    z-index: 9999;

    background: #111420;
    padding: 10px 14px;

  }
  .tt-period {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--accent);
    font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;

  .tt-values { margin-bottom: 0; }
  .tt-val-row {

  .tt-broker { color: var(--text); }
  .tt-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .tt-divider { border: none; border-top: 1px solid #1e2330; margin: 10px 0; }

  .tt-section-label {
    font-size: 9px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 8px;

  .tt-dot {
    width: 5px; height: 5px; border-radius: 50%;

  .tt-issue-link {
    font-size: 10px; color: #4a6fa5; text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    display: block; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

];

const colorMap = {};

function heatColor(val, mn, mx) {
  if (val === null) return null;
  if (mx === mn) return { bg:"#1a1f2e", fg:"#4a5568" };
  const r = (val - mn) / (mx - mn);
  if (r > 0.75) return { bg:"rgba(56,189,248,0.25)", fg:"#93c5fd" };
  if (r > 0.5)  return { bg:"rgba(56,189,248,0.12)", fg:"#7dd3fc" };
  if (r > 0.25) return { bg:"rgba(56,189,248,0.06)", fg:"#64748b" };
  return { bg:"#111420", fg:"#374151" };
}

function buildTable(filterTier = 'ALL', searchQ = '') {
  const tbody = document.getElementById('data-tbody');
  tbody.innerHTML = '';
  brokerList.forEach(broker => {
    const tier = getTier(broker);
    if (filterTier !== 'ALL' && filterTier !== 'SEARCH' && tier !== filterTier) return;
    if (searchQ && !broker.toLowerCase().includes(searchQ.toLowerCase())) return;
    const vals = RAW[broker];
    const nums = vals.filter(v => v !== null);
    const mn = Math.min(...nums), mx = Math.max(...nums);
    const tr = document.createElement('tr');
    tr.className = `tier-${tier.toLowerCase()}`;
    tr.innerHTML = `<td class="tier-cell">${tier}</td><td class="name-cell">${broker}</td>`;
    vals.forEach(v => {
      const td = document.createElement('td');
      if (v === null) {
        td.innerHTML = `<span class="null-cell">—</span>`;
      } else {
        const hc = heatColor(v, mn, mx);
        td.innerHTML = `<span class="heat" style="background:${hc.bg};color:${hc.fg}">${v.toLocaleString()}</span>`;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function filterTable(tier) {
  const q = document.getElementById('broker-search')?.value || '';
  buildTable(tier, q);
}

// Vertical event line plugin
const EVENT_LINES = {
  6:  { label: "M4Markets\n카피트레이딩 사고", color: "#f87171" },
  10: { label: "이지스퀘어\n급등", color: "#fbbf24" },

const verticalLinePlugin = {
  id: 'verticalLines',
  afterDraw(chartInst) {
    const ctx = chartInst.ctx;
    const xAxis = chartInst.scales.x;
    const yAxis = chartInst.scales.y;
    Object.entries(EVENT_LINES).forEach(([idxStr, ev]) => {
      const idx = parseInt(idxStr);
      const x = xAxis.getPixelForValue(idx);
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = ev.color + '66';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top);
      ctx.lineTo(x, yAxis.bottom);
      ctx.stroke();
      // label at top
      ctx.setLineDash([]);
      ctx.font = "9px 'IBM Plex Mono', monospace";
      ctx.fillStyle = ev.color + 'cc';
      ctx.textAlign = 'center';
      const lines = ev.label.split('\n');
      lines.forEach((line, i) => {
        ctx.fillText(line, x, yAxis.top + 12 + i * 11);
      });
      ctx.restore();
    });
  }
};
// End-point label plugin
const endLabelPlugin = {
  id: 'endLabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden) return;
      // find last non-null point
      let lastIdx = -1;
      for (let j = ds.data.length - 1; j >= 0; j--) {
        if (ds.data[j] !== null && ds.data[j] !== undefined) { lastIdx = j; break; }
      }
      if (lastIdx < 0) return;
      const pt = meta.data[lastIdx];
      if (!pt) return;
      const x = pt.x + 8;
      const y = pt.y;
      const val = ds.data[lastIdx];
      ctx.save();
      ctx.font = "bold 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = ds.borderColor;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(ds.label + ' ' + val.toLocaleString(), x, y);
      ctx.restore();
    });
  }
};

// Blinking top-3 end points
let blinkFrame = 0;
let blinkRaf = null;

function startBlink() {
  if (blinkRaf) cancelAnimationFrame(blinkRaf);
  function loop() {
    blinkFrame = (blinkFrame + 1) % 80;
    if (chart) chart.draw();
    blinkRaf = requestAnimationFrame(loop);
  }
  blinkRaf = requestAnimationFrame(loop);
}

function renderPulse() {
  // just ensures blink loop is running after chart builds
  startBlink();
}

// Plugin: draw pulsing glow on top-3 last points
const blinkPlugin = {
  id: 'blinkTop3',
  afterDatasetsDraw(chartInst) {
    const ctx = chartInst.ctx;
    const lastIdx = PERIODS.length - 1;
    const ranked = brokerList
      .filter(b => activeSet.has(b))
      .map(b => ({ b, val: RAW[b][lastIdx] ?? 0 }))
      .filter(r => r.val > 0)
      .sort((a, b) => b.val - a.val)
      .slice(0, 3);

    // sine wave: 0→1→0 over 80 frames
    const pulse = (Math.sin(blinkFrame / 80 * Math.PI * 2) + 1) / 2;

    ranked.forEach(r => {
      const dsIdx = chartInst.data.datasets.findIndex(d => d.label === r.b);
      if (dsIdx < 0) return;
      const meta = chartInst.getDatasetMeta(dsIdx);
      if (!meta || !meta.data) return;
      let ptIdx = -1;
      for (let j = meta.data.length - 1; j >= 0; j--) {
        if (RAW[r.b][j] !== null && RAW[r.b][j] !== undefined) { ptIdx = j; break; }
      }
      if (ptIdx < 0) return;
      const pt = meta.data[ptIdx];
      if (!pt) return;
      const color = colorMap[r.b];

      // outer glow ring
      const glowR = 8 + pulse * 10;
      const alpha = 0.15 + pulse * 0.35;
      ctx.save();
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, glowR, 0, Math.PI * 2);
      ctx.fillStyle = color + Math.round(alpha * 255).toString(16).padStart(2,'0');
      ctx.fill();

      // bright core dot
      const coreR = 4 + pulse * 2;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, coreR, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    });
  }
};

    <div style="padding:10px 14px 6px;border-bottom:1px solid #1e2330;background:#0a0c10">
      <div style="font-family:IBM Plex Mono,monospace;font-size:10px;color:var(--accent);font-weight:600;letter-spacing:0.12em">${period}</div>
    </div>
    <div style="padding:6px 14px">${valRows}</div>
    ${issueHTML}${brokerHTML}${industryHTML}
  `;
}

function buildTooltipHTML(di, dataPoints) {
  const period = PERIODS[di];
  const ev = EVENTS[di] || { issues:[], industry:[] };

  const activeData = dataPoints
    .filter(dp => dp.raw !== null && dp.raw !== undefined)
    .sort((a,b) => (b.raw||0) - (a.raw||0));

  const valRows = activeData.map(dp => {
    const prev = RAW[dp.dataset.label][di-1];
    let chg = '';
    if (prev !== null && prev !== undefined && prev > 0 && dp.raw !== null) {
      const pct = ((dp.raw - prev)/prev*100).toFixed(1);
      const sign = pct > 0 ? '+' : '';
      const col = pct > 0 ? '#34d399' : '#f87171';
      chg = `&nbsp;<span style="color:${col};font-size:10px">${sign}${pct}%</span>`;
    }
    return `<div class="tt-val-row">
      <span class="tt-broker" style="color:${dp.dataset.borderColor}">${dp.dataset.label}</span>
      <span class="tt-num" style="color:${dp.dataset.borderColor}">${(dp.raw||0).toLocaleString()}${chg}</span>
    </div>`;
  }).join('');

  let issueHTML = '';
  if (ev.issues && ev.issues.length) {
    const rows = ev.issues.map(e => {
      const link = e.url ? `<a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>` : '';
      return `<div class="tt-issue">
        <div class="tt-dot ${e.type}"></div>
        <div><span class="tt-issue-text">${e.text}</span>${link}</div>
      </div>`;
    }).join('');
    issueHTML = `<hr class="tt-divider"><div class="tt-section-label">📌 트래픽 이슈</div>${rows}`;
  }

  let brokerNewsHTML = '';
  if (ev.brokerNews && ev.brokerNews.length) {
    const rows = ev.brokerNews.map(e => {
      const link = e.url ? `<a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>` : '';
      return `<div class="tt-issue">
        <div class="tt-dot promo"></div>
        <div>
          <span class="tt-issue-text"><strong style="color:#e2e8f0">${e.broker}</strong> — ${e.text}</span>
          ${link}
        </div>
      </div>`;
    }).join('');
    brokerNewsHTML = `<hr class="tt-divider"><div class="tt-section-label">🏢 브로커 소식</div>${rows}`;
  }

  let industryHTML = '';
  if (ev.industry && ev.industry.length) {
    const rows = ev.industry.map(e =>
      `<div class="tt-issue">
        <div class="tt-dot news"></div>
        <div>
          <span class="tt-issue-text">${e.text}</span>
          <a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>
        </div>
      </div>`
    ).join('');
    industryHTML = `<div class="tt-industry"><div class="tt-section-label">📰 업계 동향</div>${rows}</div>`;
  }

  return `
    <div class="tt-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="tt-period">${period}</div>
        <span id="tt-close" style="color:#4a5568;cursor:pointer;font-size:14px;line-height:1;padding:0 2px">✕</span>
      </div>
    </div>
    <div class="tt-body">
      <div class="tt-values">${valRows}</div>
      ${issueHTML}
      ${brokerNewsHTML}
    </div>
    ${industryHTML}
  `;
}

function positionTooltip(tt, caretX, caretY, canvas) {
  const rect = canvas.getBoundingClientRect();
  const margin = 12;
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;

  // measure natural height first (render off-screen)
  tt.style.visibility = 'hidden';
  tt.style.display = 'block';
  tt.style.maxHeight = 'none';
  tt.style.width = '300px';
  const naturalH = tt.offsetHeight;

  const availH = vpH - margin * 2;
  const ttH = Math.min(naturalH, availH);
  tt.style.maxHeight = ttH + 'px';
  tt.style.overflowY = naturalH > availH ? 'auto' : 'visible';

  // horizontal: prefer right of caret, else left
  let left = rect.left + caretX + 16;
  if (left + 300 > vpW - margin) left = rect.left + caretX - 316;
  left = Math.max(margin, left);

  // vertical: center on caret, clamp to viewport
  let top = rect.top + caretY - ttH / 2;
  top = Math.max(margin, Math.min(top, vpH - ttH - margin));

  tt.style.left = left + 'px';
  tt.style.top  = top  + 'px';
  tt.style.visibility = 'visible';
}

function showRank() {
  const rank = document.getElementById('side-rank');
  const detail = document.getElementById('side-detail');
  if (!rank || !detail) return;
  detail.style.display = 'none';
  rank.style.display = 'block';
}

let currentDi = null;

function getDataPointsForDi(di) {
  return brokerList
    .filter(b => activeSet.has(b))
    .map(b => ({ raw: RAW[b][di], dataset: { label: b, borderColor: colorMap[b] } }))
    .filter(dp => dp.raw !== null && dp.raw !== undefined);
}

function showDetailForDi(di) {
  currentDi = di;
  const detail = document.getElementById('side-detail');
  const rank = document.getElementById('side-rank');
  const navPeriod = document.getElementById('side-nav-period');
  if (!detail || !rank) return;
  const html = buildSideHTML(di, getDataPointsForDi(di));
  const body = detail.querySelector('#side-detail-body');
  if (body) body.innerHTML = html;
  if (navPeriod) navPeriod.textContent = PERIODS[di];
  rank.style.display = 'none';
  detail.style.display = 'block';
}

function showDetail(html) {
  // legacy call from default load — parse di from html or use currentDi
  showDetailForDi(currentDi !== null ? currentDi : 4);
}

function navMonth(dir) {
  if (currentDi === null) return;
  const next = currentDi + dir;
  if (next < 0 || next >= PERIODS.length) return;
  showDetailForDi(next);
}

// click on chart → show that month's detail; click elsewhere → show rank
document.addEventListener('click', function(e) {
  if (!chart) return;
  if (e.target === chart.canvas) {
    const pts = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
    if (pts.length) {
      showDetailForDi(pts[0].index);
    }
    return;
  }
  // clicked outside chart and outside panel → back to rank
  const panel = document.getElementById('side-panel');
  if (panel && panel.contains(e.target)) return;
  showRank();
});

function externalTooltip(context) {
  // hover tooltip disabled — using click-based side panel only
}

// Click on chart → pin tooltip
document.addEventListener('click', function(e) {
  const tt = document.getElementById('tooltip');
  const closeBtn = document.getElementById('tt-close');

  // clicking the ✕ button or outside tooltip → close
  if (closeBtn && e.target === closeBtn) {
    tt.style.display = 'none';
    return;
  }
  if (tt.contains(e.target)) return; // click inside tooltip → do nothing (let links work)

  // click elsewhere → close
  tt.style.display = 'none';
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0&&tab==='data')||(i===1&&tab==='chart'));
  });
  document.getElementById('tab-data').classList.toggle('active', tab==='data');
  document.getElementById('tab-chart').classList.toggle('active', tab==='chart');
  if (tab === 'chart' && !chart) { buildToggles(); buildChart(); }
}
