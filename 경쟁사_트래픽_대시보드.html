const PALETTE = ["#38bdf8","#34d399","#f59e0b","#a78bfa","#f87171","#22d3ee","#86efac","#fcd34d","#c084fc","#fca5a5","#67e8f9","#6ee7b7","#fde68a","#d8b4fe","#fecaca","#e879f9","#4ade80","#fb923c","#60a5fa","#a3e635","#f472b6","#94a3b8","#2dd4bf","#facc15","#818cf8","#e2e8f0"];

function heatColor(val, mn, mx) {
  if (val === null) return null;
  if (mx === mn) return {bg:"#1a1f2e",fg:"#4a5568"};
  const r = (val - mn) / (mx - mn);
  if (r > 0.75) return {bg:"rgba(56,189,248,.25)",fg:"#93c5fd"};
  if (r > 0.5)  return {bg:"rgba(56,189,248,.12)",fg:"#7dd3fc"};
  if (r > 0.25) return {bg:"rgba(56,189,248,.06)",fg:"#64748b"};
  return {bg:"#111420",fg:"#374151"};
}

function buildTable(filterTier, searchQ) {
  filterTier = filterTier || 'ALL';
  searchQ = searchQ || '';
  const tbody = document.getElementById('data-tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  const lastIdx = PERIODS.length - 1;
  // find latest period with actual data
  let sortIdx = lastIdx;
  while (sortIdx > 0) {
    if (brokerList.some(function(b){ return RAW[b][sortIdx] !== null && RAW[b][sortIdx] !== undefined; })) break;
    sortIdx--;
  }
  const sorted = brokerList.slice().sort(function(a, b) {
    const av = RAW[a][sortIdx] != null ? RAW[a][sortIdx] : -1;
    const bv = RAW[b][sortIdx] != null ? RAW[b][sortIdx] : -1;
    return bv - av;
  });
  sorted.forEach(function(broker) {
    const tier = getTier(broker);
    if (filterTier !== 'ALL' && filterTier !== 'SEARCH' && tier !== filterTier) return;
    if (searchQ && broker.toLowerCase().indexOf(searchQ.toLowerCase()) < 0) return;
    const vals = RAW[broker];
    const nums = vals.filter(function(v){ return v !== null; });
    const mn = Math.min.apply(null, nums);
    const mx = Math.max.apply(null, nums);
    const tr = document.createElement('tr');
    tr.className = 'tier-' + tier.toLowerCase();
    tr.innerHTML = '<td class="tier-cell">' + tier + '</td><td class="name-cell">' + broker + '</td>';
    vals.forEach(function(v) {
      const td = document.createElement('td');
      if (v === null) {
        td.innerHTML = '<span class="null-cell">—</span>';
      } else {
        const hc = heatColor(v, mn, mx);
        td.innerHTML = '<span class="heat" style="background:' + hc.bg + ';color:' + hc.fg + '">' + v.toLocaleString() + '</span>';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function filterTable(tier) {
  const q = (document.getElementById('broker-search') || {}).value || '';
  buildTable(tier, q);
}

function buildSideHTML(di, dataPoints) {
  const period = PERIODS[di];
  const ev = EVENTS[di] || {issues:[],brokerNews:[],industry:[]};
  const activeData = dataPoints.slice().sort(function(a,b){ return (b.raw||0)-(a.raw||0); });

    const prev = RAW[dp.dataset.label][di-1];
    let chg = '';
    if (prev !== null && prev !== undefined && prev > 0 && dp.raw !== null) {
      const pct = ((dp.raw - prev)/prev*100).toFixed(1);
      const sign = pct > 0 ? '+' : '';
      const col = pct >= 0 ? '#34d399' : '#f87171';
      chg = '<span style="font-size:10px;color:' + col + '">' + sign + pct + '%</span>';
    }
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1f2e">'
      + '<span style="font-size:11px;color:' + dp.dataset.borderColor + '">' + dp.dataset.label + '</span>'
      + '<div style="text-align:right"><span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:600;color:' + dp.dataset.borderColor + '">' + (dp.raw||0).toLocaleString() + '</span>' + (chg ? '<br>' + chg : '') + '</div>'

  }).join('');

  function makeIssueRow(e, dotColor) {

        return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:flex-start">'

      }).join('')
      + '</div>';
  }
  let industryHTML = '';
  if (ev.industry && ev.industry.length) {
    industryHTML = '<div style="border-top:1px solid #1e2330;padding:10px 14px 6px;background:#0f1219"><div style="font-size:9px;font-family:\'IBM Plex Mono\',monospace;color:var(--muted);letter-spacing:.1em;margin-bottom:6px">📰 업계 동향</div>'

      }).join('')

  }
  return '<div style="padding:6px 14px">' + valRows + '</div>' + issueHTML + brokerHTML + industryHTML;

  const rows = brokerList
    .filter(function(b){ return activeSet.has(b); })
    .map(function(b){ return {b:b, curr:RAW[b][lastIdx]||0, prev:RAW[b][lastIdx-1]||0}; })
    .filter(function(r){ return r.curr > 0; })
    .sort(function(a,b){ return b.curr - a.curr; });
  const list = document.getElementById('rank-list');
  if (!list) return;
  list.innerHTML = rows.map(function(r, i) {
    const pct = r.prev > 0 ? ((r.curr - r.prev)/r.prev*100).toFixed(1) : null;
    const chgHTML = pct !== null ? '<span style="font-size:10px;color:' + (pct>=0?'#34d399':'#f87171') + '">' + (pct>=0?'+':'') + pct + '%</span>' : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a1f2e">'
      + '<div style="display:flex;align-items:center;gap:6px">'
      + '<span style="font-size:9px;font-family:\'IBM Plex Mono\',monospace;color:#4a5568;width:14px">' + (i+1) + '</span>'
      + '<span style="width:8px;height:8px;border-radius:50%;background:' + colorMap[r.b] + ';flex-shrink:0;display:inline-block"></span>'
      + '<span style="font-size:11px;color:#e2e8f0">' + r.b + '</span></div>'
      + '<div style="text-align:right"><span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:600;color:' + colorMap[r.b] + '">' + r.curr.toLocaleString() + '</span><br>' + chgHTML + '</div></div>';
  }).join('');
}

// Vertical line plugin
const verticalLinePlugin = {
  id: 'verticalLines',
  afterDraw: function(chartInst) {
    const ctx = chartInst.ctx;
    const xAxis = chartInst.scales.x;
    const yAxis = chartInst.scales.y;
    Object.keys(EVENT_LINES).forEach(function(idxStr) {
      const ev = EVENT_LINES[idxStr];
      const idx = parseInt(idxStr);
      const x = xAxis.getPixelForValue(idx);
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle = ev.color + '66';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, yAxis.top);
      ctx.lineTo(x, yAxis.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "9px 'IBM Plex Mono', monospace";
      ctx.fillStyle = ev.color + 'cc';
      ctx.textAlign = 'center';
      const lines = ev.label.split('\n');
      lines.forEach(function(line, i){ ctx.fillText(line, x, yAxis.top + 12 + i*11); });
      ctx.restore();
    });
  }
};

// End label plugin
const endLabelPlugin = {
  id: 'endLabels',
  afterDatasetsDraw: function(chartInst) {
    const ctx = chartInst.ctx;
    chartInst.data.datasets.forEach(function(ds, i) {
      const meta = chartInst.getDatasetMeta(i);
      if (meta.hidden) return;
      let lastIdx = -1;
      for (let j = ds.data.length-1; j >= 0; j--) {
        if (ds.data[j] !== null && ds.data[j] !== undefined) { lastIdx = j; break; }
      }
      if (lastIdx < 0) return;
      const pt = meta.data[lastIdx];
      if (!pt) return;
      ctx.save();
      ctx.font = "bold 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = ds.borderColor;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(ds.label + ' ' + (ds.data[lastIdx]||0).toLocaleString(), pt.x + 8, pt.y);
      ctx.restore();
    });
  }
};

// Blink plugin
let blinkFrame = 0;
let blinkRaf = null;
function startBlink() {
  if (blinkRaf) cancelAnimationFrame(blinkRaf);
  function loop() {
    blinkFrame = (blinkFrame + 1) % 80;
    if (chart) chart.draw();
    blinkRaf = requestAnimationFrame(loop);
  }
  blinkRaf = requestAnimationFrame(loop);
}

const blinkPlugin = {
  id: 'blinkTop3',
  afterDatasetsDraw: function(chartInst) {
    const ctx = chartInst.ctx;
    const sortIdx = PERIODS.length - 1;
    const ranked = brokerList
      .filter(function(b){ return activeSet.has(b); })
      .map(function(b){ return {b:b, val:RAW[b][sortIdx]||0}; })
      .filter(function(r){ return r.val > 0; })
      .sort(function(a,b){ return b.val - a.val; })
      .slice(0,3);
    const pulse = (Math.sin(blinkFrame/80*Math.PI*2)+1)/2;
    ranked.forEach(function(r) {
      const dsIdx = chartInst.data.datasets.findIndex(function(d){ return d.label === r.b; });
      if (dsIdx < 0) return;
      const meta = chartInst.getDatasetMeta(dsIdx);
      if (!meta || !meta.data) return;
      let ptIdx = -1;
      for (let j = meta.data.length-1; j >= 0; j--) {
        if (RAW[r.b][j] !== null && RAW[r.b][j] !== undefined) { ptIdx = j; break; }
      }
      if (ptIdx < 0) return;
      const pt = meta.data[ptIdx];
      if (!pt) return;
      const color = colorMap[r.b];
      const glowR = 8 + pulse * 10;
      const alpha = 0.15 + pulse * 0.35;
      const alphaHex = Math.round(alpha*255).toString(16).padStart(2,'0');
      ctx.save();
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, glowR, 0, Math.PI*2);
      ctx.fillStyle = color + alphaHex;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4 + pulse*2, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    });
  }
};

function makeDatasets() {
  return brokerList.filter(function(b){ return activeSet.has(b); }).map(function(b) {
    return {
      label: b,
      data: RAW[b].slice(),
      borderColor: colorMap[b],
      backgroundColor: colorMap[b] + '18',
      borderWidth: 2,
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: colorMap[b],
      tension: 0.35,
      spanGaps: true
    };
  });
}

function buildToggles() {
  const wrap = document.getElementById('broker-toggles');
  brokerList.forEach(function(b) {
    const btn = document.createElement('div');
    btn.className = 'broker-toggle' + (activeSet.has(b) ? ' active' : '');
    btn.textContent = b;
    btn.style.borderColor = colorMap[b];
    btn.style.color = colorMap[b];
    btn.style.background = activeSet.has(b) ? colorMap[b]+'22' : 'transparent';
    btn.onclick = function() {
      if (activeSet.has(b)) activeSet.delete(b); else activeSet.add(b);
      btn.classList.toggle('active');
      btn.style.background = activeSet.has(b) ? colorMap[b]+'22' : 'transparent';
      if (chart) { chart.data.datasets = makeDatasets(); chart.update(); }
      updateRankPanel();
    };
    wrap.appendChild(btn);
  });
}

function buildChart() {
  const ctx = document.getElementById('traffic-chart').getContext('2d');
  setTimeout(function(){ showDetailForDi(4); }, 150);
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: makeDatasets() },
    plugins: [verticalLinePlugin, endLabelPlugin, blinkPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: 160 } },
      interaction: { mode: 'index', intersect: false },
      animation: { onComplete: function(){ startBlink(); } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      },
      scales: {
        x: {
          grid: { color: '#1a1f2e' },
          ticks: {
            font: { family:"'IBM Plex Mono', monospace", size:11, weight:'600' },
            color: function(ctx) {
              const label = PERIODS[ctx.index] || '';
              return label.startsWith('26') ? '#e2e8f0' : '#6b7280';
            },
            maxRotation: 0
          }
        },
        y: {
          grid: { color: '#1a1f2e' },
          ticks: {
            color: '#4a5568',
            font: { family:"'IBM Plex Mono', monospace", size:10 },
            callback: function(v){ return v.toLocaleString(); }
          }
        }
      }
    }
  });
  updateRankPanel();
}

// Click to show detail
document.addEventListener('click', function(e) {
  if (!chart) return;
  if (e.target === chart.canvas) {
    const pts = chart.getElementsAtEventForMode(e, 'index', {intersect:false}, true);
    if (pts.length) showDetailForDi(pts[0].index);
    return;
  }
  const panel = document.getElementById('side-panel');
  if (panel && panel.contains(e.target)) return;
  showRank();
});

// Side panel hover persistence
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('side-panel');
    if (!panel) return;
    let hideTimer = null;
    panel.addEventListener('mouseenter', function() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    });
    panel.addEventListener('mouseleave', function() {
      hideTimer = setTimeout(showRank, 200);
    });
  });
})();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('active', (i===0&&tab==='data')||(i===1&&tab==='chart'));
  });
  document.getElementById('tab-data').classList.toggle('active', tab==='data');
  document.getElementById('tab-chart').classList.toggle('active', tab==='chart');
  if (tab === 'chart' && !chart) { buildToggles(); buildChart(); }
}

// Init
buildTable();
</script>
