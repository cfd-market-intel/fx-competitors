  }

  .tabs {
    display: flex;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab {
    padding: 14px 24px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.03em;

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content.active { display: block; }

  .table-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;

  thead tr { background: #0a0c10; }

    padding: 10px 12px; text-align: center;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    font-weight: 600; color: var(--muted);
    letter-spacing: 0.08em; border-bottom: 1px solid var(--border);
    white-space: nowrap;

  th.left { text-align: left; }
  td {
    padding: 8px 12px; text-align: center;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid #111420; transition: background 0.1s;

  tr.tier-t2 td.tier-cell { color: #a78bfa; }
  tr.tier-t3 td.tier-cell { color: #6b7280; }
  .heat { border-radius: 3px; padding: 4px 8px; display: inline-block; min-width: 44px; }
  .null-cell { color: #2a3040; }

  .broker-toggle {

    border: 1px solid; transition: all 0.15s;

    position: relative; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; height: 480px;

    border-radius: 10px;
    padding: 0;

    text-transform: uppercase; margin-bottom: 8px;

  .tt-dot {

const PALETTE = [
  "#38bdf8","#34d399","#f59e0b","#a78bfa","#f87171",
  "#22d3ee","#86efac","#fcd34d","#c084fc","#fca5a5",
  "#67e8f9","#6ee7b7","#fde68a","#d8b4fe","#fecaca",
  "#e879f9","#4ade80","#fb923c","#60a5fa","#a3e635",
  "#f472b6","#94a3b8","#2dd4bf","#facc15","#818cf8","#e2e8f0",
];
const brokerList = Object.keys(RAW);
const colorMap = {};
brokerList.forEach((b,i) => colorMap[b] = PALETTE[i % PALETTE.length]);

function heatColor(val, mn, mx) {
  if (val === null) return null;
  if (mx === mn) return { bg:"#1a1f2e", fg:"#4a5568" };
  const r = (val - mn) / (mx - mn);
  if (r > 0.75) return { bg:"rgba(56,189,248,0.25)", fg:"#93c5fd" };
  if (r > 0.5)  return { bg:"rgba(56,189,248,0.12)", fg:"#7dd3fc" };
  if (r > 0.25) return { bg:"rgba(56,189,248,0.06)", fg:"#64748b" };
  return { bg:"#111420", fg:"#374151" };
}

function buildTable(filterTier = 'ALL') {
  const tbody = document.getElementById('data-tbody');
  tbody.innerHTML = '';
  brokerList.forEach(broker => {
    const tier = getTier(broker);
    if (filterTier !== 'ALL' && tier !== filterTier) return;
    const vals = RAW[broker];
    const nums = vals.filter(v => v !== null);
    const mn = Math.min(...nums), mx = Math.max(...nums);
    const tr = document.createElement('tr');
    tr.className = `tier-${tier.toLowerCase()}`;
    tr.innerHTML = `<td class="tier-cell">${tier}</td><td class="name-cell">${broker}</td>`;
    vals.forEach(v => {
      const td = document.createElement('td');
      if (v === null) {
        td.innerHTML = `<span class="null-cell">—</span>`;
      } else {
        const hc = heatColor(v, mn, mx);
        td.innerHTML = `<span class="heat" style="background:${hc.bg};color:${hc.fg}">${v.toLocaleString()}</span>`;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
buildTable();

// ── CHART ─────────────────────────────────────────────────────────────────────
const activeSet = new Set(["인피녹스","컬쳐캐피탈","제로마켓","한텍마켓","이지스퀘어","XM거래소","DPrime"]);

function buildToggles() {
  const wrap = document.getElementById('broker-toggles');
  brokerList.forEach(b => {
    const btn = document.createElement('div');
    btn.className = 'broker-toggle' + (activeSet.has(b) ? ' active' : '');
    btn.textContent = b;
    btn.style.borderColor = colorMap[b];
    btn.style.color = colorMap[b];
    btn.style.background = activeSet.has(b) ? colorMap[b]+'22' : 'transparent';
    btn.onclick = () => {
      if (activeSet.has(b)) activeSet.delete(b);
      else activeSet.add(b);
      btn.classList.toggle('active');
      btn.style.background = activeSet.has(b) ? colorMap[b]+'22' : 'transparent';
      updateChart();
    };
    wrap.appendChild(btn);
  });
}

let chart;
function makeDatasets() {
  return brokerList.filter(b => activeSet.has(b)).map(b => ({
    label: b,
    data: RAW[b].map(v => v),
    borderColor: colorMap[b],
    backgroundColor: colorMap[b] + '18',
    borderWidth: 2,
    pointRadius: 4,
    pointHoverRadius: 7,
    pointBackgroundColor: colorMap[b],
    tension: 0.35,
    spanGaps: true,
  }));
}

function buildChart() {
  const ctx = document.getElementById('traffic-chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: PERIODS, datasets: makeDatasets() },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip },
      },
      scales: {
        x: {
          grid: { color: '#1a1f2e' },
          ticks: { color: '#4a5568', font: { family:"'IBM Plex Mono', monospace", size:10 } }
        },
        y: {
          grid: { color: '#1a1f2e' },
          ticks: {
            color: '#4a5568',
            font: { family:"'IBM Plex Mono', monospace", size:10 },
            callback: v => v.toLocaleString()
          }
        }
      }
    }
  });
}

function updateChart() {
  chart.data.datasets = makeDatasets();
  chart.update();
}

// TOOLTIP — hover shows, persists when mouse enters tooltip
let pinnedIndex = null;
let tooltipHovered = false;

document.addEventListener('DOMContentLoaded', () => {
  const tt = document.getElementById('tooltip');
  tt.addEventListener('mouseenter', () => { tooltipHovered = true; });
  tt.addEventListener('mouseleave', () => {
    tooltipHovered = false;
    setTimeout(() => {
      if (!tooltipHovered && pinnedIndex === null) {
        tt.style.display = 'none';
      }
    }, 120);
  });
});

function buildTooltipHTML(di, dataPoints) {
  const period = PERIODS[di];
  const ev = EVENTS[di] || { issues:[], industry:[] };

  const activeData = dataPoints
    .filter(dp => dp.raw !== null && dp.raw !== undefined)
    .sort((a,b) => (b.raw||0) - (a.raw||0));

  const valRows = activeData.map(dp => {
    const prev = RAW[dp.dataset.label][di-1];
    let chg = '';
    if (prev !== null && prev !== undefined && prev > 0 && dp.raw !== null) {
      const pct = ((dp.raw - prev)/prev*100).toFixed(1);
      const sign = pct > 0 ? '+' : '';
      const col = pct > 0 ? '#34d399' : '#f87171';
      chg = `&nbsp;<span style="color:${col};font-size:10px">${sign}${pct}%</span>`;
    }
    return `<div class="tt-val-row">
      <span class="tt-broker" style="color:${dp.dataset.borderColor}">${dp.dataset.label}</span>
      <span class="tt-num" style="color:${dp.dataset.borderColor}">${(dp.raw||0).toLocaleString()}${chg}</span>
    </div>`;
  }).join('');

  let issueHTML = '';
  if (ev.issues && ev.issues.length) {
    const rows = ev.issues.map(e => {
      const link = e.url ? `<a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>` : '';
      return `<div class="tt-issue">
        <div class="tt-dot ${e.type}"></div>
        <div><span class="tt-issue-text">${e.text}</span>${link}</div>
      </div>`;
    }).join('');
    issueHTML = `<hr class="tt-divider"><div class="tt-section-label">📌 트래픽 이슈</div>${rows}`;
  }

  let brokerNewsHTML = '';
  if (ev.brokerNews && ev.brokerNews.length) {
    const rows = ev.brokerNews.map(e => {
      const link = e.url ? `<a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>` : '';
      return `<div class="tt-issue">
        <div class="tt-dot promo"></div>
        <div>
          <span class="tt-issue-text"><strong style="color:#e2e8f0">${e.broker}</strong> — ${e.text}</span>
          ${link}
        </div>
      </div>`;
    }).join('');
    brokerNewsHTML = `<hr class="tt-divider"><div class="tt-section-label">🏢 브로커 소식</div>${rows}`;
  }

  let industryHTML = '';
  if (ev.industry && ev.industry.length) {
    const rows = ev.industry.map(e =>
      `<div class="tt-issue">
        <div class="tt-dot news"></div>
        <div>
          <span class="tt-issue-text">${e.text}</span>
          <a class="tt-issue-link" href="${e.url}" target="_blank">${e.url}</a>
        </div>
      </div>`
    ).join('');
    industryHTML = `<div class="tt-industry"><div class="tt-section-label">📰 업계 동향</div>${rows}</div>`;
  }

  return `
    <div class="tt-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="tt-period">${period}</div>
        <span id="tt-close" style="color:#4a5568;cursor:pointer;font-size:14px;line-height:1;padding:0 2px">✕</span>
      </div>
    </div>
    <div class="tt-body">
      <div class="tt-values">${valRows}</div>
      ${issueHTML}
      ${brokerNewsHTML}
    </div>
    ${industryHTML}
  `;
}

function positionTooltip(tt, caretX, caretY, canvas) {
  const rect = canvas.getBoundingClientRect();
  const margin = 12;
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;

  // measure natural height first (render off-screen)
  tt.style.visibility = 'hidden';
  tt.style.display = 'block';
  tt.style.maxHeight = 'none';
  tt.style.width = '300px';
  const naturalH = tt.offsetHeight;

  const availH = vpH - margin * 2;
  const ttH = Math.min(naturalH, availH);
  tt.style.maxHeight = ttH + 'px';
  tt.style.overflowY = naturalH > availH ? 'auto' : 'visible';

  // horizontal: prefer right of caret, else left
  let left = rect.left + caretX + 16;
  if (left + 300 > vpW - margin) left = rect.left + caretX - 316;
  left = Math.max(margin, left);

  // vertical: center on caret, clamp to viewport
  let top = rect.top + caretY - ttH / 2;
  top = Math.max(margin, Math.min(top, vpH - ttH - margin));

  tt.style.left = left + 'px';
  tt.style.top  = top  + 'px';
  tt.style.visibility = 'visible';
}

function externalTooltip(context) {
  const tt = document.getElementById('tooltip');
  if (pinnedIndex !== null) return;
  if (tooltipHovered) return; // mouse is on tooltip, don't update/hide

  if (context.tooltip.opacity === 0) {
    // only hide if mouse not on tooltip
    if (!tooltipHovered) tt.style.display = 'none';
    return;
  }
  const di = context.tooltip.dataPoints?.[0]?.dataIndex;
  if (di === undefined) { tt.style.display = 'none'; return; }

  tt.innerHTML = buildTooltipHTML(di, context.tooltip.dataPoints);
  positionTooltip(tt, context.tooltip.caretX, context.tooltip.caretY, context.chart.canvas);
  tt.style.display = 'block';
}

// Click on chart → pin tooltip
document.addEventListener('click', function(e) {
  const tt = document.getElementById('tooltip');
  const closeBtn = document.getElementById('tt-close');

  // clicking the ✕ button or outside tooltip → close
  if (closeBtn && e.target === closeBtn) {
    pinnedIndex = null;
    tt.style.display = 'none';
    return;
  }
  if (tt.contains(e.target)) return; // click inside tooltip → do nothing (let links work)

  // clicking on chart canvas → pin
  if (chart && e.target === chart.canvas) {
    const points = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
    if (points.length) {
      const di = points[0].index;
      const dataPoints = chart.data.datasets
        .filter(ds => activeSet.has(ds.label))
        .map(ds => ({ raw: ds.data[di], dataset: ds }))
        .filter(dp => dp.raw !== null);
      pinnedIndex = di;
      tt.innerHTML = buildTooltipHTML(di, dataPoints);
      const rect = chart.canvas.getBoundingClientRect();
      positionTooltip(tt, e.clientX - rect.left, e.clientY - rect.top, chart.canvas);
      tt.style.display = 'block';
    }
    return;
  }

  // click elsewhere → close
  pinnedIndex = null;
  tt.style.display = 'none';
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0&&tab==='data')||(i===1&&tab==='chart'));
  });
  document.getElementById('tab-data').classList.toggle('active', tab==='data');
  document.getElementById('tab-chart').classList.toggle('active', tab==='chart');
  if (tab === 'chart' && !chart) { buildToggles(); buildChart(); }
}
